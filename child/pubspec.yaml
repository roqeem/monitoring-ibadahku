name: ibadahku
description: "IbadahKu - Aplikasi Monitoring Ibadah Harian Muslim"
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.3.0
  fl_chart: ^0.69.2
  intl: ^0.20.0
  provider: ^6.1.0
  flutter_local_notifications: ^20.1.0
  timezone: ^0.10.1
  audioplayers: ^6.6.0
  flutter_timezone: ^5.1.0
  geolocator: ^14.0.2
  geocoding: ^4.0.0
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  firebase_messaging: ^15.1.1
  firebase_analytics: ^11.3.1
  google_sign_in: ^6.2.1
  adhan_dart: ^2.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/audio/azan.mp3
